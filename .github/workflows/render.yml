name: Render reel
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique id for this reel (set by n8n)
        required: true
      job:
        description: Render job JSON (set by n8n)
        required: true
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check job id
        run: |
          [[ "$JOB_ID" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad job_id"; exit 1; }
      - name: Cache FFmpeg and fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/tools
            ~/.fonts
          key: ffmpeg-btbn-gpl-montserrat-v1
      - name: Install FFmpeg, fonts and voice
        timeout-minutes: 6
        run: |
          mkdir -p ~/tools ~/.fonts
          if [ ! -x ~/tools/ffmpeg ]; then
            ( curl -fsSL --retry 3 --max-time 180 -o /tmp/ff.tar.xz \
                https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xf /tmp/ff.tar.xz -C /tmp && cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe ~/tools/ ) \
            || ( echo "GitHub FFmpeg build unavailable, trying johnvansickle.com" \
              && curl -fsSL --retry 3 --max-time 180 -o /tmp/ff2.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              && tar -xf /tmp/ff2.tar.xz -C /tmp && cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe ~/tools/ )
          fi
          echo "$HOME/tools" >> "$GITHUB_PATH"
          export PATH="$HOME/tools:$PATH"
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass " && echo "subtitle support OK" || echo "WARNING: this ffmpeg has no subtitle support"
          for w in ExtraBold Bold; do
            [ -f ~/.fonts/Montserrat-$w.ttf ] || curl -fsSL --retry 3 --max-time 60 -o ~/.fonts/Montserrat-$w.ttf \
              https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-$w.ttf || echo "font $w skipped"
          done
          fc-cache -f ~/.fonts >/dev/null 2>&1 || true
          fc-list | grep -ci montserrat || echo "Montserrat not installed; captions will use a default font"
          pip install -q "edge-tts>=7.2.8" "piper-tts==1.3.0"
      - name: Cache offline voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en_US-lessac-medium-v1
      - name: Get offline backup voice
        timeout-minutes: 3
        run: |
          [ -f voices/en_US-lessac-medium.onnx ] || python -m piper.download_voices en_US-lessac-medium --data-dir voices || echo "backup voice download failed"
      - name: Render
        timeout-minutes: 8
        env:
          JOB_JSON: ${{ inputs.job }}
        run: python render_cli.py
      - name: Upload video
        run: |
          gh release view reels >/dev/null 2>&1 || gh release create reels --title "Rendered reels" --notes "Videos made by n8n. Old ones are removed automatically."
          gh release upload reels "$JOB_ID.mp4" --clobber
      - name: Report failure to n8n
        if: failure() || cancelled()
        run: |
          echo "Render failed. Open this run in GitHub Actions to see the log." > "$JOB_ID.error.txt"
          gh release view reels >/dev/null 2>&1 || gh release create reels --title "Rendered reels" --notes "auto"
          gh release upload reels "$JOB_ID.error.txt" --clobber
      - name: Delete videos older than 3 days
        if: always()
        run: |
          gh release view reels --json assets --jq '.assets[] | select((.createdAt | fromdateiso8601) < (now - 259200)) | .name' 2>/dev/null \
            | while read -r name; do gh release delete-asset reels "$name" -y; done || true
